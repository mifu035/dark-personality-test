let currentQ = 0;
let answers = [];
let selectedOption = -1;

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function startTest() {
  currentQ = 0;
  answers = [];
  showPage('page-quiz');
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentQ];
  document.getElementById('progressFill').style.width = ((currentQ) / questions.length * 100) + '%';
  document.getElementById('progressText').textContent = `第 ${currentQ + 1} / ${questions.length} 题`;
  document.getElementById('qNum').textContent = `QUESTION ${String(currentQ + 1).padStart(2, '0')}`;
  document.getElementById('qText').textContent = q.text;

  const box = document.getElementById('optionsBox');
  box.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = String.fromCharCode(65 + i) + '. ' + opt;
    btn.onclick = () => selectOption(i, btn);
    box.appendChild(btn);
  });
  selectedOption = -1;
}

function selectOption(i, btnEl) {
  document.querySelectorAll('.option').forEach(b => b.classList.remove('selected'));
  btnEl.classList.add('selected');
  selectedOption = i;

  setTimeout(() => {
    answers.push(i + 1); // A=1, B=2, C=3
    currentQ++;
    if (currentQ >= questions.length) {
      document.getElementById('progressFill').style.width = '100%';
      showPage('page-pay');
    } else {
      renderQuestion();
    }
  }, 200);
}

function unlockResult() {
  // 计算总分
  const total = answers.reduce((a, b) => a + b, 0);
  const idx = Math.round(((total - 18) / 36) * (resultConfigs.length - 1));
  const config = resultConfigs[Math.max(0, Math.min(resultConfigs.length - 1, idx))];

  // 计算实际分数
  const realScore = Math.round(((total - 18) / 36) * 100);

  // 渲染结果
  document.getElementById('scoreDisplay').textContent = realScore;
  document.getElementById('scoreDesc').textContent = config.desc;
  
  // 角色卡片 - 用CSS设计，不依赖外部图片
  const bgClass = 'char-bg-' + (idx + 1);
  const emojiMap = ['🕊️', '🩰', '🎬', '🦊', '🎭'];
  document.getElementById('charImg').className = 'character-img ' + bgClass;
  document.getElementById('charImg').innerHTML = `
    <div class="char-emoji">${emojiMap[idx] || '🎬'}</div>
    <div class="char-movie-label">${config.movie}</div>
    <div class="char-title">${config.character}</div>
  `;
  document.getElementById('charName').textContent = config.character;
  document.getElementById('charMovie').textContent = config.movie;
  document.getElementById('reasonBox').textContent = config.reason;

  // 性格画像
  const pg = document.getElementById('personalityGrid');
  pg.innerHTML = '';
  Object.entries(config.personality).forEach(([k, v]) => {
    const div = document.createElement('div');
    div.className = 'personality-item';
    div.innerHTML = `<div class="personality-label">${k}</div><div class="personality-value">${v}</div>`;
    pg.appendChild(div);
  });

  document.getElementById('leastBox').innerHTML = `<strong>最不像的人物：</strong>${config.least}`;

  showPage('page-result');
}

function restart() {
  showPage('page-cover');
}

function shareResult() {
  const text = '我测了阴暗面人格测试，结果太准了！快来测测你最像哪个电影角色～';
  if (navigator.share) {
    navigator.share({ title: '阴暗面影视人格测试', text: text, url: window.location.href });
  } else {
    navigator.clipboard.writeText(text + ' ' + window.location.href);
    alert('链接已复制，快去分享给朋友吧！');
  }
}
